{% extends 'blog/base.html' %}

{% block content %}
    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
        <small>{{ post.author }} | {{ post.published_date }}</small>
        <hr>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
    <form method="GET" action="/search/">
    <input type="text" name="q" placeholder="Search posts..." required>
    <button type="submit">Search</button>
</form>

{% endblock %}
