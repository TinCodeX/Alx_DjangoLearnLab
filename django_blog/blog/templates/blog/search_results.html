{% extends 'blog/base.html' %}
{% block content %}
<h2>Search Results for "{{ query }}"</h2>
{% if posts %}
    {% for post in posts %}
        <h3><a href="/post/{{ post.pk }}/">{{ post.title }}</a></h3>
        <p>{{ post.content|truncatechars:100 }}</p>
        <hr>
    {% endfor %}
{% else %}
    <p>No posts found.</p>
{% endif %}
<a href="/">Back to Home</a>
{% endblock %}
